<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SOCIALVERSE</title>
<style>
:root{--b:#702D42;--bl:#E9CFC8;--cr:#F8F3EC;--w:#fff;--t:#33252A;--g:linear-gradient(45deg,#702D42,#c2576f,#E9CFC8)}
*{box-sizing:border-box}body{margin:0;font:14px/1.45 system-ui,sans-serif;background:var(--cr);color:var(--t)}
h1,h2,h3,.logo{font-family:Georgia,serif;margin:0}button{font:inherit;cursor:pointer;border:0;border-radius:10px;padding:8px 14px;background:var(--b);color:#fff}button.g{background:var(--bl);color:var(--b)}button.i{background:none;color:var(--t);padding:4px 7px;font-size:20px}
input,select,textarea{font:inherit;width:100%;padding:9px;border:1px solid var(--bl);border-radius:10px;background:#fff;color:var(--t);margin:4px 0}
#app{display:flex;min-height:100vh}nav{width:230px;background:var(--w);border-right:1px solid var(--bl);padding:18px 12px;position:sticky;top:0;height:100vh;overflow:auto}
nav .logo{color:var(--b);font-size:24px;padding:0 10px 14px}nav a{display:flex;gap:10px;padding:10px;border-radius:10px;cursor:pointer}nav a:hover,nav a.on{background:var(--bl);color:var(--b);font-weight:600}
main{flex:1;max-width:760px;margin:auto;padding:18px;width:100%}.card{background:#fff;border-radius:16px;box-shadow:0 2px 12px #702d4222;margin-bottom:16px;overflow:hidden}.pad{padding:14px}
.stories{display:flex;gap:14px;overflow:auto;padding:6px 2px 14px}.st{text-align:center;font-size:12px;cursor:pointer;min-width:66px}
.ring{width:64px;height:64px;border-radius:50%;padding:3px;background:var(--g);margin:auto}.ring.seen{background:#ccc}.ring.add{background:var(--bl)}
.av{width:100%;height:100%;border-radius:50%;border:2px solid #fff;background:var(--b) center/cover;color:#fff;display:flex;align-items:center;justify-content:center;font-weight:700}
.sm{width:36px;height:36px;display:inline-block;vertical-align:middle;margin-right:8px}
.img{aspect-ratio:1;background:center/cover;display:flex;align-items:center;justify-content:center;color:#fff;font:italic 26px Georgia;text-align:center;padding:20px}
.row{display:flex;align-items:center;gap:8px;flex-wrap:wrap}.sp{flex:1}.muted{color:#8a737a;font-size:12px}
.tag{color:var(--b);font-weight:600;cursor:pointer}.pill{display:inline-block;padding:6px 12px;border-radius:20px;background:var(--bl);color:var(--b);margin:3px;cursor:pointer;font-size:13px}.pill.on{background:var(--b);color:#fff}
.ov{position:fixed;inset:0;background:#000d;z-index:50;display:flex;align-items:center;justify-content:center}.modal{background:#fff;border-radius:18px;padding:18px;width:min(460px,94vw);max-height:90vh;overflow:auto}
.sv{width:min(400px,100vw);height:min(720px,100vh);border-radius:16px;position:relative;color:#fff;display:flex;flex-direction:column;justify-content:center;text-align:center;font:italic 28px Georgia;padding:30px;background-size:cover}
.bars{position:absolute;top:10px;left:10px;right:10px;display:flex;gap:4px}.bars i{flex:1;height:3px;background:#fff5;border-radius:3px;overflow:hidden}.bars b{display:block;height:100%;background:#fff;width:0}
.reels{height:calc(100vh - 120px);overflow-y:scroll;scroll-snap-type:y mandatory}.reel{height:100%;scroll-snap-align:start;border-radius:18px;margin-bottom:12px;position:relative;color:#fff;display:flex;align-items:flex-end;overflow:hidden;background-size:cover}.reel video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}.reel .in{position:relative;padding:18px;flex:1;background:linear-gradient(transparent,#000a)}.reel .side{position:relative;padding:18px;text-align:center;font-size:12px}
.bub{max-width:75%;padding:8px 12px;border-radius:16px;margin:4px 0;background:var(--bl)}.bub.me{background:var(--b);color:#fff;margin-left:auto}
.cover{width:48px;height:48px;border-radius:10px;flex:none}.bar{height:6px;background:var(--bl);border-radius:6px;cursor:pointer}.bar b{display:block;height:100%;width:0;background:var(--b);border-radius:6px}
table{border-collapse:collapse;width:100%;font-size:13px}td,th{border:1px solid var(--bl);padding:5px 8px;text-align:left}th{background:var(--bl)}pre{background:var(--t);color:var(--bl);padding:10px;border-radius:10px;overflow:auto;font-size:12px}
.xg{display:grid;grid-template-columns:repeat(3,1fr);grid-auto-rows:clamp(100px,22vw,200px);gap:4px;grid-auto-flow:dense;margin-top:10px}.xg .img{aspect-ratio:auto;font-size:13px;padding:8px;border-radius:6px;position:relative;cursor:pointer}.xg .big{grid-column:span 2;grid-row:span 2;font-size:22px}.xl{position:absolute;bottom:4px;left:6px;font:600 11px system-ui;text-shadow:0 0 4px #000}
html.dk{--cr:#17120f;--w:#221a1d;--t:#f1e6e8;--bl:#4a2f38}html.dk .card,html.dk .modal,html.dk input,html.dk select,html.dk textarea,html.dk #bn{background:#221a1d;color:#f1e6e8}html.dk #tb .logo,html.dk .logo,html.dk .tag{color:#e9a5b8}html.dk .pill,html.dk button.g,html.dk button.i,html.dk nav a{color:#f1e6e8}html.dk .pill.on,html.dk nav a.on{color:#fff}
#tb{display:none}
@media(max-width:800px){#app{flex-direction:column}#tb{display:flex;align-items:center;gap:4px;position:sticky;top:0;z-index:15;background:var(--w);padding:6px 12px;border-bottom:1px solid var(--bl)}#tb .logo{color:var(--b);font-size:20px}}
#toast{position:fixed;bottom:80px;left:50%;transform:translateX(-50%);background:var(--t);color:#fff;padding:10px 18px;border-radius:20px;z-index:99;display:none}
.auth{min-height:100vh;display:flex;align-items:center;justify-content:center;background:var(--g);padding:16px}.auth .card{padding:26px;width:min(380px,100%)}
#bn{display:none}@media(max-width:800px){nav{display:none}#bn{display:flex;position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid var(--bl);justify-content:space-around;z-index:20;padding:6px}main{padding:12px 12px 80px}.reels{height:calc(100vh - 160px)}}
</style></head><body><div id="app"></div><div id="toast"></div>
<script>
const $=s=>document.querySelector(s),esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const GR=['linear-gradient(135deg,#702D42,#E9CFC8)','linear-gradient(135deg,#33252A,#702D42)','linear-gradient(45deg,#f09433,#dc2743,#bc1888)','linear-gradient(135deg,#2b5876,#4e4376)','linear-gradient(135deg,#11998e,#38ef7d)','linear-gradient(135deg,#c2576f,#F8F3EC)'];
const H=36e5,now=()=>Date.now();
function seed(){const U=['aanya','rohan','meera','kabir','zoya'].map((u,i)=>({u,p:'demo',bio:['Café hopper ☕','Guitar & code 🎸','Painting the city','Trail runner','Bookworm 📚'][i],pub:1,fol:[],bg:i,pic:''}));
const P=['Golden hour never disappoints #sunset','New track dropping soon #music','Studio day #art','Sunday long run #fitness','Reading list #books','Coffee first #cafe'].map((c,i)=>({id:i+1,u:U[i%5].u,cap:c,bg:GR[i],img:'',lk:[],cm:[{u:U[(i+1)%5].u,t:'Love this!'}],sv:[],t:now()-i*3*H}));
const S=U.slice(0,4).map((x,i)=>({id:i+1,u:x.u,bg:GR[i+1],text:['Hello world ✨','Studio vibes','Trail views','Chapter 12 done'][i],music:i,t:now()-i*2*H,views:[],close:0}));
return{users:U,posts:P,stories:S,msgs:[],notes:[{t:'aanya liked your post',ts:now()-H}],me:null,fav:[],feat:{},seen:{},hist:[],uid:50,reels:[]}}
let D=JSON.parse(localStorage.sv2||'null')||seed(),V='home',MV=null,CH='aanya';const save=()=>localStorage.sv2=JSON.stringify(D);
const me=()=>D.users.find(x=>x.u===D.me),U=u=>D.users.find(x=>x.u===u)||{u,pic:''};
const toast=m=>{const t=$('#toast');t.textContent=m;t.style.display='block';clearTimeout(toast.h);toast.h=setTimeout(()=>t.style.display='none',2200)};
const av=(u,c='')=>{const x=U(u);return`<div class="av ${c}" style="${x.pic?`background-image:url(${x.pic})`:''}">${x.pic?'':esc(u[0].toUpperCase())}</div>`};
const ago=t=>{const h=(now()-t)/H;return h<1?Math.max(1,~~(h*60))+'m':h<24?~~h+'h':~~(h/24)+'d'};
const addN=t=>{const z=D.set||{};if((/ liked /.test(t)&&z.nlk===0)||(/followed/.test(t)&&z.nfo===0))return;D.notes.unshift({t,ts:now()});save()};
const rd=(f,cb)=>{const r=new FileReader();r.onload=()=>cb(r.result);r.readAsDataURL(f)};
// ---------- songs (original synthesized audio) ----------
const SONGS=[['Velvet Hour','SV Originals',[0,4,7,12,7,4]],['Blush Sky','SV Originals',[2,5,9,14,9,5]],['City Rain','SV Originals',[-3,0,4,7,4,0]],['Golden Loop','SV Originals',[5,9,12,17,12,9]],['Midnight Run','SV Originals',[0,3,7,10,7,3]],['Soft Focus','SV Originals',[7,11,14,19,14,11]]].map((s,i)=>({n:s[0],a:s[1],notes:s[2],bg:GR[i%6],d:30}));
let AC,cur=-1,vol=.5,pos=0,tm=null,aud=null,gain;
function play(i){stopA();cur=i;const s=SONGS[i];pos=0;D.hist=[i,...D.hist.filter(x=>x!==i)].slice(0,6);
if(s.url){aud=new Audio(s.url);aud.volume=vol;aud.play().catch(()=>toast('Tap play again to allow audio'))}else{AC=AC||new(window.AudioContext||webkitAudioContext)();gain=AC.createGain();gain.gain.value=vol*.3;gain.connect(AC.destination)}
let k=0;tm=setInterval(()=>{pos+=.25;if(!s.url&&k++%2==0){const o=AC.createOscillator();o.type='triangle';o.frequency.value=220*2**(s.notes[(k/2|0)%6]/12);o.connect(gain);o.start();o.stop(AC.currentTime+.4)}
const p=$('#pb');if(p)p.style.width=Math.min(100,pos/(s.url&&aud.duration||s.d)*100)+'%';if(pos>=(s.url&&aud.duration||s.d))nextS()},250);tmUI()}
const stopA=()=>{clearInterval(tm);tm=null;if(aud){aud.pause();aud=null}};
const nextS=()=>play((cur+1)%SONGS.length),tog=()=>{if(cur<0)return play(0);if(tm){if(aud)aud.pause();clearInterval(tm);tm=null}else{const p=pos;play(cur);pos=p}tmUI()};
const tmUI=()=>{const b=$('#pp');if(b)b.textContent=tm?'⏸':'▶'},setVol=v=>{vol=v/100;if(gain)gain.gain.value=vol*.3;if(aud)aud.volume=vol};
const fav=i=>{D.fav=D.fav.includes(i)?D.fav.filter(x=>x!==i):[...D.fav,i];save();go('music')};
function upAudio(f){if(!f)return;SONGS.push({n:f.name.replace(/\.\w+$/,''),a:'Your upload',notes:[0],bg:GR[2],d:30,url:URL.createObjectURL(f)});toast('Song added (this session)');go('music')}
// ---------- auth ----------
function auth(m='in'){$('#app').innerHTML=`<div class="auth"><div class="card"><h1 class="logo" style="color:var(--b);font-size:34px">SOCIALVERSE</h1><p class="muted">Your World. Your People. Your Stories.</p>
<input id="au" placeholder="Username"><input id="ap" type="password" placeholder="Password">
<div class="row"><button onclick="doAuth(0)">Log in</button><button class="g" onclick="doAuth(1)">Register</button><button class="g" onclick="guest()">Guest demo</button></div>
<p class="muted">Local browser demo: accounts live only in this browser's storage — there is no shared online server. Demo logins: aanya / demo.</p></div></div>`}
function doAuth(reg){const u=$('#au').value.trim().toLowerCase(),p=$('#ap').value;if(!u||!p)return toast('Enter username and password');const x=D.users.find(y=>y.u===u);
if(reg){if(x)return toast('Username already taken');if(!/^\w{3,}$/.test(u))return toast('Use 3+ letters/numbers');D.users.push({u,p,bio:'New on SocialVerse',pub:1,fol:['aanya'],bg:0,pic:''})}else if(!x||x.p!==p)return toast('Wrong username or password');
D.me=u;D.hist2=0;(D.login=D.login||[]).unshift(new Date().toLocaleString()+' · this browser');save();go('home')}
function guest(){if(!U('guest').bio)D.users.push({u:'guest',p:'',bio:'Exploring SocialVerse',pub:1,fol:['aanya','rohan'],bg:0,pic:''});D.me='guest';save();go('home')}
const logout=()=>{D.me=null;save();auth()};
// ---------- shell ----------
const NAV=[['home','🏠','Home'],['reels','🎬','Reels'],['explore','🔍','Explore'],['msgs','💬','Messages'],['notifs','🔔','Notifications'],['music','🎵','Music'],['search','🔎','People Search'],['snap','👻','Mini Snap'],['viva','🎓','Viva Showcase'],['features','🧩','Feature Explorer'],['dbms','🗄️','DBMS Concepts'],['admin','🛡️','Admin'],['profile','👤','Profile'],['settings','⚙️','Settings']];
function go(v,a){if(!D.me)return auth();V=v;MV=a||null;const body=({home,reels,explore,msgs,notifs,music,features,viva,search:psPage,snap:snapPage,dbms,admin,profile,settings})[v]();
$('#app').innerHTML=`<nav><div class="logo">SOCIALVERSE</div>${NAV.map(n=>`<a class="${n[0]==V?'on':''}" onclick="go('${n[0]}')">${n[1]} ${n[2]}</a>`).join('')}<a onclick="newPost()">➕ Create</a><a onclick="logout()">🚪 Log out</a></nav><div id="tb"><b class="logo">SOCIALVERSE</b><span class="sp"></span><button class="i" onclick="go('search')">🔎</button><button class="i" onclick="go('settings')">⚙️</button></div><main>${body}</main><div id="bn">${[['home','🏠'],['explore','🔍'],['reels','🎬'],['snap','👻'],['profile','👤']].map(n=>`<button class="i" onclick="go('${n[0]}')">${n[1]}</button>`).join('')}<button class="i" onclick="newPost()">➕</button><button class="i" onclick="menu()">☰</button></div>`;tmUI()}
// ---------- home ----------
const live=()=>D.stories.filter(s=>now()-s.t<24*H);
function home(){const mine=me(),us=[...new Set(live().map(s=>s.u))];
const st=`<div class="stories"><div class="st" onclick="newPost(1)"><div class="ring add">${av(D.me)}</div>Your story</div>${us.map(u=>`<div class="st" onclick="openStory('${u}')"><div class="ring ${D.seen[u]&&D.seen[u]>=Math.max(...live().filter(s=>s.u==u).map(s=>s.id))?'seen':''}">${av(u)}</div>${esc(u)}</div>`).join('')}</div>`;
const sug=D.users.filter(u=>u.u!==D.me&&!mine.fol.includes(u.u));
return wg()+fbar()+(on('Digital Detox Mode')?'':st)+(sug.length?`<div class="card pad"><b>Suggested for you (${sug.length})</b><div style="max-height:280px;overflow:auto">${sug.map(u=>`<div class="row" style="margin-top:8px"><span class="sm">${av(u.u)}</span><b>${u.u}</b><span class="sp"></span><button onclick="follow('${u.u}')">Follow</button></div>`).join('')}</div></div>`:'')+
feedFx()}
function post(p){const you=D.me;return`<div class="card"><div class="row pad"><span class="sm">${av(p.u)}</span><b onclick="go('profile','${p.u}')" style="cursor:pointer">${esc(p.u)}</b><span class="muted">${ago(p.t)}</span><span class="sp"></span>${p.u==you?`<button class="i" onclick="delPost(${p.id})">🗑️</button>`:`<button class="i" title="Report" onclick="toast('Report sent to admin');addN('You reported ${p.u}')">⚑</button>`}</div>
<div class="img" ondblclick="like(${p.id})" style="background-image:${p.img?`url(${p.img})`:p.bg};${p.filter?'filter:'+p.filter:''}">${p.img?'':esc(p.cap.split('#')[0])}</div>
<div class="pad"><div class="row"><button class="i" onclick="like(${p.id})">${p.lk.includes(you)?'❤️':'🤍'}</button><button class="i" onclick="$('#c${p.id}').focus()">💬</button><button class="i" onclick="navigator.clipboard&&navigator.clipboard.writeText('SocialVerse post #${p.id}');toast('Link copied')">📤</button><span class="sp"></span><button class="i" onclick="savePost(${p.id})">${p.sv.includes(you)?'🔖':'📑'}</button></div>
${on('Hidden Popularity Mode')?'':`<b>${p.lk.length} likes</b>`}<div><b>${esc(p.u)}</b> ${esc(p.cap).replace(/#(\w+)/g,'<span class="tag" onclick="go(\'explore\',\'$1\')">#$1</span>')}</div>
${p.cm.map((c,i)=>`<div class="muted" style="color:var(--t)"><b>${esc(c.u)}</b> ${esc(c.t)} ${c.u==you?`<span style="cursor:pointer" onclick="delC(${p.id},${i})">✕</span>`:''}</div>`).join('')}
<div class="row"><input id="c${p.id}" placeholder="Add a comment…" style="flex:1;width:auto" onkeydown="if(event.key=='Enter')cmt(${p.id})"><button onclick="cmt(${p.id})">Post</button></div></div></div>`}
const like=id=>{const p=D.posts.find(x=>x.id==id),i=p.lk.indexOf(D.me);i<0?(p.lk.push(D.me),p.u!=D.me&&addN(D.me+' liked '+p.u+"'s post")):p.lk.splice(i,1);save();go(V,MV)};
const savePost=id=>{const p=D.posts.find(x=>x.id==id),i=p.sv.indexOf(D.me);i<0?p.sv.push(D.me):p.sv.splice(i,1);save();toast(i<0?'Saved':'Removed from saved');go(V,MV)};
function cmt(id){const el=$('#c'+id),t=el.value.trim();if(!t)return toast('Write a comment first');if(!cmtOK(id))return;if(/hate|stupid|idiot|ugly/i.test(t))return toast('⚠ Toxic comment detector blocked this comment');D.posts.find(x=>x.id==id).cm.push({u:D.me,t});save();go(V,MV)}
const delC=(id,i)=>{D.posts.find(x=>x.id==id).cm.splice(i,1);save();go(V,MV)},delPost=id=>{if(confirm('Delete this post?')){D.posts=D.posts.filter(p=>p.id!=id);save();toast('Post deleted');go(V,MV)}};
function follow(u){const m=me(),i=m.fol.indexOf(u);i<0?(m.fol.push(u),addN('You followed '+u)):m.fol.splice(i,1);save();toast(i<0?'Following '+u:'Unfollowed '+u);go(V,MV)}
// ---------- create ----------
let draft={};
function newPost(st){draft={st:!!st,img:'',f:''};const o=document.createElement('div');o.className='ov';o.id='cm';o.innerHTML=`<div class="modal"><h3>Create ${st?'story':'post'}</h3><div class="row"><span class="pill ${st?'':'on'}" onclick="cm.remove();newPost()">Post</span><span class="pill ${st?'on':''}" onclick="cm.remove();newPost(1)">Story</span></div>
<div id="pv" class="img" style="aspect-ratio:1.3;background:${GR[0]}">Preview</div>
<input type="file" accept="image/*,video/*" onchange="pick(this.files[0])"><button class="g" onclick="cam()">📷 Use camera</button>
<textarea id="cap" rows="2" placeholder="${st?'Text overlay':'Caption with #hashtags'}"></textarea>
<select id="flt" onchange="draft.f=this.value;$('#pv').style.filter=this.value"><option value="">No filter</option><option value="sepia(.8)">Sepia</option><option value="grayscale(1)">Mono</option><option value="saturate(2) hue-rotate(-20deg)">Vivid</option></select>
<select id="mus"><option value="">No music</option>${SONGS.map((s,i)=>`<option value="${i}">🎵 ${s.n}</option>`).join('')}</select>
<div class="row"><button onclick="publish()">Publish</button><button class="g" onclick="cm.remove()">Cancel</button></div></div>`;document.body.appendChild(o)}
function pick(f){if(!f)return;if(f.type.startsWith('video')){draft.vid=URL.createObjectURL(f);$('#pv').innerHTML=`<video src="${draft.vid}" style="width:100%" controls></video>`;draft.isV=1;return}rd(f,d=>{draft.img=d;$('#pv').style.backgroundImage=`url(${d})`;$('#pv').textContent=''})}
async function cam(){try{const s=await navigator.mediaDevices.getUserMedia({video:true});$('#pv').innerHTML='<video autoplay playsinline style="width:100%"></video>';const v=$('#pv video');v.srcObject=s;$('#pv').insertAdjacentHTML('afterend','<button id="snap" onclick="snap()">Capture</button>');window._s=s}catch(e){toast('Camera blocked — please upload a file instead')}}
function snap(){const v=$('#pv video'),c=document.createElement('canvas');c.width=v.videoWidth;c.height=v.videoHeight;c.getContext('2d').drawImage(v,0,0);draft.img=c.toDataURL('image/jpeg',.7);_s.getTracks().forEach(t=>t.stop());$('#pv').innerHTML='';$('#pv').style.backgroundImage=`url(${draft.img})`;$('#snap').remove();toast('Photo captured')}
function publish(){const cap=$('#cap').value.trim(),m=$('#mus').value;if(!cap&&!draft.img&&!draft.isV)return toast('Add a photo, video or text first');
const bg=GR[D.uid%6],id=D.uid++;
if(draft.isV)D.reels.push({id,u:D.me,cap,bg,music:m,lk:[],t:now()}),window['rv'+id]=draft.vid;
else if(draft.st)D.stories.push({id:id+100,u:D.me,bg,img:draft.img,text:cap,music:m===''?null:+m,t:now(),views:[],filter:draft.f});
else D.posts.push({id,u:D.me,cap,bg,img:draft.img,lk:[],cm:[],sv:[],t:now(),filter:draft.f});
save();cm.remove();toast('Published!');go(draft.isV?'reels':'home')}
// ---------- stories viewer ----------
let SQ=[],SI=0,ST=null;
function openStory(u){SQ=live().filter(s=>s.u==u).sort((a,b)=>a.id-b.id);SI=0;if(!SQ.length)return;const o=document.createElement('div');o.className='ov';o.id='sv';document.body.appendChild(o);showS()}
function showS(){const s=SQ[SI];if(!s)return closeS();D.seen[s.u]=Math.max(D.seen[s.u]||0,s.id);if(s.u!=D.me&&!(s.views||[]).includes(D.me)){(s.views=s.views||[]).push(D.me)}save();
if(s.music!=null&&s.music!=='')play(+s.music);
$('#sv').innerHTML=`<div class="sv" style="background-image:${s.img?`url(${s.img})`:s.bg};${s.filter?'filter:'+s.filter:''}"><div class="bars">${SQ.map((_,i)=>`<i><b style="width:${i<SI?100:0}%;${i==SI?'transition:width 5s linear':''}" ${i==SI?'id="cb"':''}></b></i>`).join('')}</div>
<div class="row" style="position:absolute;top:22px;left:14px;font:600 14px system-ui"><span class="sm">${av(s.u)}</span>${esc(s.u)} · ${ago(s.t)}${s.music!=null&&s.music!==''?' · 🎵 '+SONGS[s.music].n:''}</div>

return`<h2>⚙️ Settings</h2><div>${T.map(t=>`<span class="pill ${SS==t[0]?'on':''}" onclick="SS='${t[0]}';go('settings')">${t[1]}</span>`).join('')}</div>${b}`}
// ---- Mini Snap ----
let SN={img:'',f:''};
function snapPage(){D.snaps=D.snaps||[];if(!D.snapSeed){D.snapSeed=1;D.snaps.push({id:++D.sid||(D.sid=1),a:'aanya',b:D.me,img:'',bg:GR[2],cap:'Welcome to Mini Snap! 👻',f:'',ts:now()-6e4,seen:0});save()}
const inb=D.snaps.filter(x=>x.b==D.me&&!x.seen),sent=D.snaps.filter(x=>x.a==D.me).slice(-5).reverse(),fr=D.users.filter(u=>u.u!=D.me&&!u.blocked),cnt=u=>D.snaps.filter(x=>(x.a==D.me&&x.b==u)||(x.b==D.me&&x.a==u)).length;
return`<h2>👻 Mini Snap</h2><p class="muted">Quick photo messages that disappear after being opened once.</p><div class="card pad"><b>📥 Inbox (${inb.length})</b>${inb.map(x=>`<div class="row"><span class="sm">${av(x.a)}</span><b>@${x.a}</b><span class="muted">${ago(x.ts)}</span><span class="sp"></span><button onclick="openSnap(${x.id})">👁 Open</button></div>`).join('')||'<p class="muted">No new snaps</p>'}</div>
<div class="card pad"><b>📸 New snap</b><video id="snv" autoplay playsinline muted style="width:100%;border-radius:12px;background:#000;max-height:260px;display:none"></video><img id="snp" style="width:100%;border-radius:12px;display:none;max-height:260px;object-fit:cover"><div class="row"><button onclick="snCam()">📷 Camera</button><button class="g" onclick="snShot()">Capture</button><label class="pill">Upload<input type="file" accept="image/*" hidden onchange="rd(this.files[0],snSet)"></label></div>
<select onchange="SN.f=this.value;$('#snv').style.filter=this.value;$('#snp').style.filter=this.value"><option value="">No filter</option><option value="sepia(.8)">Sepia</option><option value="grayscale(1)">Mono</option><option value="hue-rotate(90deg) saturate(2)">Neon</option><option value="blur(2px) brightness(1.2)">Dreamy</option></select><input id="snc" placeholder="Caption (optional with photo)"><select id="snt">${fr.map(u=>`<option value="${u.u}">@${u.u}${cnt(u.u)?' 🔥'+cnt(u.u):''}</option>`).join('')}</select><div class="row"><button onclick="snSend()">Send snap ➤</button><button class="g" onclick="snStory()">Add to my story</button></div></div>

async function snCam(){try{window._sn=await navigator.mediaDevices.getUserMedia({video:true});const v=$('#snv');v.srcObject=window._sn;v.style.display='block';$('#snp').style.display='none'}catch(e){toast('Camera blocked — use Upload instead')}}
function snSet(d){SN.img=d;const p=$('#snp');p.src=d;p.style.display='block';$('#snv').style.display='none'}
function snShot(){const v=$('#snv');if(!v.videoWidth)return toast('Start the camera first');const c=document.createElement('canvas');c.width=320;c.height=320*v.videoHeight/v.videoWidth;c.getContext('2d').drawImage(v,0,0,c.width,c.height);snSet(c.toDataURL('image/jpeg',.6));window._sn&&window._sn.getTracks().forEach(t=>t.stop());toast('Captured')}
function snSend(){const to=$('#snt').value,cap=$('#snc').value.trim();if(!SN.img&&!cap)return toast('Capture a photo or write a caption');D.snaps.push({id:++D.sid,a:D.me,b:to,img:SN.img,bg:GR[now()%6],cap,f:SN.f,ts:now(),seen:0});save();toast('Snap sent to @'+to);const me0=D.me;SN.img='';setTimeout(()=>{if(D.me==me0){D.snaps.push({id:++D.sid,a:to,b:me0,img:'',bg:GR[3],cap:'Got your snap! 😄',f:'',ts:now(),seen:0});save();if(V=='snap')go('snap')}},4000);go('snap')}
function snStory(){const cap=$('#snc').value.trim();if(!SN.img&&!cap)return toast('Capture a photo or write a caption');const id=D.uid++;D.stories.push({id:id+100,u:D.me,bg:GR[id%6],img:SN.img,text:cap,music:null,t:now(),views:[],filter:SN.f});save();SN.img='';toast('Added to your story');go('home')}
function openSnap(id){const x=D.snaps.find(s=>s.id==id);if(!x)return;x.seen=1;const img=x.img;x.img='';save();const o=document.createElement('div');o.className='ov';o.id='cm';o.innerHTML=`<div class="sv" style="background-image:${img?`url(${img})`:x.bg};${x.f?'filter:'+x.f:''}"><div class="row" style="position:absolute;top:14px;left:14px;font:600 14px system-ui">@${x.a} · disappears in <span id="snt2">8</span>s</div>${esc(x.cap||'')}</div>`;document.body.appendChild(o);let n=8;const t=setInterval(()=>{n--;const e=$('#snt2');if(e)e.textContent=n;if(n<=0||!$('#cm')){clearInterval(t);const c=$('#cm');c&&c.remove();if(V=='snap')go('snap')}},1000);o.onclick=()=>{n=0}}
fx();
